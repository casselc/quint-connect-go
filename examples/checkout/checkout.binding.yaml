# Recorded checkout steps as calls of model/checkout.qnt. Steps are
# recorded at the commits where they take effect (Txn.OnCommit), in the
# shop's database or the provider's; every parameter is the step field of
# its name.
spec: model/checkout.qnt
module: checkout
constants:
  STOCK: '2'
actions:
  place: {}
  charge: {}
  refund: {}
  markPaid: {}
  ship: {}
  cancel: {}
  settle: {}
invariants: [chargedAtMostOnce, settledCorrectly]
