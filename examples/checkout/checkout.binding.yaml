# Recorded checkout steps as calls of model/checkout.qnt. Steps are
# recorded at the commits where they take effect (Txn.OnCommit), in the
# shop's database or the provider's; every parameter is the step field of
# its name. Placing and cancelling compare the stock they leave with the
# model's: without it, a cancellation that forgot to restock went unseen
# (a mutant that every exploration survived).
spec: model/checkout.qnt
module: checkout
constants:
  STOCK: '2'
actions:
  place:
    expect: 'stock == {{.obs.stock}}'
  charge: {}
  refund: {}
  markPaid: {}
  ship: {}
  cancel:
    expect: 'stock == {{.obs.stock}}'
  settle: {}
invariants: [chargedAtMostOnce, settledCorrectly]
