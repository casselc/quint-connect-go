# Recorded broadcast steps as calls of ../model/broadcast.qnt.
spec: ../model/broadcast.qnt
module: broadcast
constants:
  NODES: '{{ set "node" "src" "dst" }}'
  VALUES: '{{ set "value" }}'
actions:
  broadcast:
    args: { node: '{{.node}}', value: '{{.value}}' }
  gossip:
    # values is recorded as a JSON array; toSet makes it a Quint set
    args: { id: '{{.id}}', src: '{{.src}}', dst: '{{.dst}}', values: '{{ toSet .values }}' }
  deliver:
    args: { id: '{{.id}}' }
  read:
    args: { node: '{{.node}}' }
    expect: 'seen.get({{.node}}) == {{ toSet .obs.values }}'
  settle: {}
invariants: [noInvention, convergedWhenSettled]
