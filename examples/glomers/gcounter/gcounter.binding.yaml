# Recorded gcounter steps as calls of ../model/gcounter.qnt. Vectors are
# recorded as JSON objects (toMap).
spec: ../model/gcounter.qnt
module: gcounter
constants:
  NODES: '{{ set "node" "src" "dst" }}'
actions:
  add:     {}
  gossip:  {}
  deliver: {}
  read:    {}
  settle: {}
invariants: [noOvercount, countsEveryAdd]
