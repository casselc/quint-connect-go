# Regenerates ledgerpb (README: "Regenerating the protobuf code"):
# `buf generate` in this directory, with protoc-gen-go and
# protoc-gen-go-grpc on PATH. No protoc needed: buf compiles the proto.
version: v2
plugins:
  - local: protoc-gen-go
    out: ledgerpb
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: ledgerpb
    opt: paths=source_relative
inputs:
  - directory: proto
